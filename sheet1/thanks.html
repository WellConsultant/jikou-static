<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お申し込みありがとうございます｜時効援用通知書作成用ヒアリングフォーム</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#1f2937;background:#f4f7fb;line-height:1.7}body{margin:0}.wrap{max-width:720px;margin:0 auto;padding:40px 16px 64px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:14px;padding:28px;margin:16px 0;box-shadow:0 4px 14px #17345d0d}h1{font-size:1.55rem;line-height:1.4;margin:0 0 12px;color:#123b67}h2{font-size:1.15rem;color:#123b67;border-left:4px solid #2f75b5;padding-left:10px;margin-top:0}.notice{background:#ecfdf3;border-left:4px solid #16834b;padding:14px;border-radius:6px}.option{display:block;border:1px solid #cbd8e6;border-radius:10px;padding:16px;margin:12px 0;background:#fff;cursor:pointer}.option:hover{background:#f5f9fd}.option input{margin-right:8px}.button{border:0;border-radius:8px;background:#1f5f96;color:white;padding:12px 18px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}.button.secondary{background:#64748b}.hidden{display:none}.small{font-size:.88rem;color:#667085}.back{margin-top:20px}
  </style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <div class="notice"><h1>お申し込みありがとうございます。</h1><p>ヒアリングフォームの入力を受け付けました。</p></div>
    <p>続いて、お支払い方法をお選びください。</p>
    <p><strong>料金：1件 15,000円（税別）</strong></p>
  </section>
  <section class="card">
    <h2>お支払い方法を選択してください</h2>
    <label class="option"><input type="radio" name="paymentMethod" value="card">クレジットカードで支払う</label>
    <label class="option"><input type="radio" name="paymentMethod" value="bank">銀行振込で支払う</label>
    <div id="cardPayment" class="notice hidden"><strong>クレジットカード決済</strong><p>Stripeの決済ページへ進んでお支払いください。</p><a class="button" href="https://buy.stripe.com/5kQaEYcexbG96rA3AS6c00J" target="_blank" rel="noopener">クレジットカード決済へ進む</a></div>
    <div id="bankPayment" class="notice hidden"><strong>銀行振込</strong><p>銀行振込を選択しました。振込先口座は受付メールでご案内します。</p><p class="small">現在の作業版では、申込内容の保存・自動返信メール・振込先口座の表示はまだ実装されていません。</p></div>
  </section>
  <p class="back"><a class="button secondary" href="./">フォームへ戻る</a></p>
</main>
<script>
document.querySelectorAll('input[name="paymentMethod"]').forEach(function(el){el.addEventListener('change',function(){
  document.getElementById('cardPayment').classList.toggle('hidden',this.value!=='card');
  document.getElementById('bankPayment').classList.toggle('hidden',this.value!=='bank');
});});
</script>
</body>
</html>
